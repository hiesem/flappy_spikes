name: build

on:
  push:
    branches: [main, feat/ios]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: test
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Signed AAB only when the keystore secrets are configured; unsigned otherwise.
      - name: Decode keystore (if secrets present)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/app/key.properties
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    # Signed iOS build: a development IPA (artifact, installed over USB) and an
    # App Store build uploaded to TestFlight. Unsigned when the Apple secrets
    # are missing (forks / PRs).
    runs-on: macos-15
    env:
      HAS_APPLE: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Unsigned build (no Apple secrets)
        if: env.HAS_APPLE != 'true'
        run: flutter build ipa --no-codesign --release
      - name: Signing setup
        if: env.HAS_APPLE == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DEV_P12: ${{ secrets.IOS_DEV_P12 }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          for c in DEV DIST; do
            v=IOS_${c}_P12; echo "${!v}" | base64 -d > $RUNNER_TEMP/$c.p12
            security import $RUNNER_TEMP/$c.p12 -k "$KC" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$ASC_KEY_P8" | base64 -d > $RUNNER_TEMP/asc.p8
      - name: Archive
        if: env.HAS_APPLE == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          BN=$((1000 + GITHUB_RUN_NUMBER))
          flutter build ios --config-only --release --build-number=$BN
          cd ios && pod install && cd ..
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/Runner.xcarchive archive \
            DEVELOPMENT_TEAM=TF9VESMTKV CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 200
          test -d $RUNNER_TEMP/Runner.xcarchive
      - name: Export development IPA
        if: env.HAS_APPLE == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > $RUNNER_TEMP/dev.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>debugging</string>
            <key>teamID</key><string>TF9VESMTKV</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/dev.plist -exportPath build/ios/dev \
            -allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        if: env.HAS_APPLE == 'true'
        with:
          name: ios-dev-ipa
          path: build/ios/dev/*.ipa
      - name: Upload to TestFlight
        if: env.HAS_APPLE == 'true' && github.event_name != 'pull_request'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > $RUNNER_TEMP/store.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>TF9VESMTKV</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Runner.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/store.plist -exportPath build/ios/store \
            -allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        if: env.HAS_APPLE != 'true'
        with:
          name: runner-ipa-unsigned
          path: build/ios/ipa/
