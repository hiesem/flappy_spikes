name: wda

# WebDriverAgent (appium) signed for the team's registered devices, so the
# Linux workstation can drive the test iPhone (pymobiledevice3 xcuitest +
# usbmux forward 8100). Runs on a push to ci/wda or manually.
on:
  push:
    branches: [ci/wda]
  workflow_dispatch:
    inputs:
      wda_ref:
        description: appium/WebDriverAgent tag
        default: v16.13.6

jobs:
  wda:
    runs-on: macos-15
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: ${{ inputs.wda_ref || 'v16.13.6' }}
          path: wda
      - name: Signing setup
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DEV_P12: ${{ secrets.IOS_DEV_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$IOS_DEV_P12" | base64 -d > $RUNNER_TEMP/dev.p12
          security import $RUNNER_TEMP/dev.p12 -k "$KC" -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$ASC_KEY_P8" | base64 -d > $RUNNER_TEMP/asc.p8
      - name: Build for testing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        working-directory: wda
        run: |
          xcodebuild build-for-testing -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner -destination 'generic/platform=iOS' \
            -derivedDataPath $RUNNER_TEMP/dd \
            DEVELOPMENT_TEAM=TF9VESMTKV CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER=com.flappyspikes.wda \
            -allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/asc.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 120
      - name: Package
        run: |
          APP=$(find $RUNNER_TEMP/dd/Build/Products -name 'WebDriverAgentRunner-Runner.app' -maxdepth 3 | head -1)
          echo "$APP"; /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist"
          mkdir -p out/Payload && cp -R "$APP" out/Payload/ && (cd out && zip -qry ../wda.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: wda-ipa
          path: wda.ipa
