{{> content_head}}
<main id="top">
  <section class="zone lost first p-glider">
    <div class="wrap">
      <canvas data-paint="crash:strip" data-color="#5E1A8C" data-bird="classic" width="480" height="340" aria-label="The bird hits the spikes and tumbles down">The bird hit the spikes.</canvas>
      <span class="eyebrow">Error 404</span>
      <h1>Page not found</h1>
      <p class="lead">This page flew into the spikes. The game is still flying, though.</p>
      <a class="banner" href="/">Back to the game</a>
      <div class="badges">
        {{badges:404:appstore}}
      </div>
    </div>
  </section>
</main>
{{> content_foot}}
