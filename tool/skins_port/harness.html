<!doctype html>
<html><head><meta charset="utf-8"><title>Skins port harness</title>
<style>body{margin:0;background:#fff}canvas{display:block}</style></head>
<body>
<script>
// PRD-2.3 §19.6 port check: renders the 60 new items with the approved page's
// JavaScript (design/skins_v23) into one sheet, cell by cell, at a fixed t and
// a seeded Math.random. The Flutter twin is test/skins/p23_skins_port_test.dart.
// Query: ?design=<abs path to design/>&t=<seconds>
(function(){let a=1234567;Math.random=function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();
const Q=new URLSearchParams(location.search),D=Q.get('design');
const files=[D+'/menu_v2/skin_art.js'];
window.NEW={items:{hat:[],acc:[],hoop:[],fire:[]},hat:{},accBack:{},accFront:{},hoop:{},trail:{}};
for(const n of['hats','gear','hoops','trails'])files.push(D+'/skins_v23/parts/'+n+'.js');
function load(i){if(i>=files.length){go();return}const s=document.createElement('script');s.src='file://'+files[i];s.onload=()=>load(i+1);s.onerror=()=>{document.title='ERR '+files[i]};document.body.appendChild(s)}
load(0);
function go(){
 // the src.html glue
 {const _hat=hat,_ab=accBack,_af=accFront,_hh=hoopHalf,_te=trailEmit,_td=trailDraw;
 hat=(ctx,id,s,t)=>NEW.hat[id]?NEW.hat[id](ctx,s,t):_hat(ctx,id,s,t);
 accBack=(ctx,id,s,t,f)=>NEW.items.acc.some(x=>x.id===id)?(NEW.accBack[id]&&NEW.accBack[id](ctx,s,t,f)):_ab(ctx,id,s,t,f);
 accFront=(ctx,id,s,t,f)=>NEW.items.acc.some(x=>x.id===id)?(NEW.accFront[id]&&NEW.accFront[id](ctx,s,t,f)):_af(ctx,id,s,t,f);
 hoopHalf=(ctx,id,x,y,ry,t,front,lw=7)=>NEW.hoop[id]?(ctx.save(),NEW.hoop[id](ctx,x,y,ry,t,front,lw),ctx.restore()):_hh(ctx,id,x,y,ry,t,front,lw);
 trailEmit=(st,id,x,y,dt,k,vx=-140)=>NEW.trail[id]?NEW.trail[id].emit(st,x,y,dt,k,vx):_te(st,id,x,y,dt,k,vx);
 trailDraw=(ctx,st,id,k,head)=>NEW.trail[id]?(ctx.save(),NEW.trail[id].draw(ctx,st,k,head),ctx.restore()):_td(ctx,st,id,k,head);}
 const T=+(Q.get('t')||1.3),S=+(Q.get('s')||2),W=160,H=110,COLS=+(Q.get('cols')||4);
 let items=[...NEW.items.hat.map(x=>['hat',x]),...NEW.items.acc.map(x=>['acc',x]),...NEW.items.hoop.map(x=>['hoop',x]),...NEW.items.fire.map(x=>['fire',x])];
 if(Q.get('only'))items=items.filter(([c,x])=>Q.get('only').split(',').includes(c+':'+x.id.slice(2)));
 const cv=document.createElement('canvas');cv.width=COLS*W*S;cv.height=Math.ceil(items.length/COLS)*H*S;document.body.appendChild(cv);const ctx=cv.getContext('2d');
 items.forEach(([cat,it],n)=>{const ox=(n%COLS)*W,oy=Math.floor(n/COLS)*H;
  ctx.setTransform(S,0,0,S,ox*S,oy*S);ctx.fillStyle='#FCD9EE';ctx.fillRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(cat==='hat'){ctx.translate(80,72);ctx.scale(1.7,1.7);drawLook(ctx,{bird:'classic',hat:it.id},T,false)}
  else if(cat==='acc'){ctx.translate(84,58);ctx.scale(1.7,1.7);drawLook(ctx,{bird:'classic',acc:it.id},T,false)}
  else if(cat==='hoop'){hoopHalf(ctx,it.id,80,55,42,T,false,7);ctx.save();ctx.translate(80,55);ctx.scale(1.2,1.2);drawLook(ctx,{bird:'classic'},T,false);ctx.restore();hoopHalf(ctx,it.id,80,55,42,T,true,7)}
  else{const kk=1.6,hx=112,hy=55,st=Trail();st.look={bird:'classic'};for(let i=0;i<90;i++){trailEmit(st,it.id,hx-14*kk,hy,1/60,kk,-150);trailStep(st,1/60)}trailDraw(ctx,st,it.id,kk,{x:hx-14*kk,y:hy});ctx.save();ctx.translate(hx,hy);ctx.scale(kk,kk);drawLook(ctx,{bird:'classic'},T,false);ctx.restore()}
  ctx.restore()});
 window.__png=cv.toDataURL('image/png');window.__ready=true}
</script></body></html>
